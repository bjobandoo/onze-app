name: onze_app
description: "Onze — conecta jugadores de fútbol amateur con canchas sintéticas en Ibarra, Ecuador."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navegación
  go_router: ^14.6.1

  # Backend
  supabase_flutter: ^2.8.4

  # Mapas
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI / Tipografía
  google_fonts: ^6.2.1

  # Modelos inmutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Variables de entorno
  flutter_dotenv: ^5.2.1

  # Logger
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  # Generación de código
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  riverpod_generator: ^2.6.3

  # Riverpod lint
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - .env
